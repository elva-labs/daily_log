name: CI

# Tests gate every change. A release is cut only when MARKETING_VERSION names a
# version that has not been released yet — so routine commits to main run the
# tests and stop, and shipping is an explicit act of bumping the version in
# Xcode rather than a side effect of pushing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    # Pinned, not macos-latest: that label follows the newest image and would
    # pull in a future Xcode, while this project targets macOS 26.5 / Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Test
        run: |
          xcodebuild test \
            -project daily_log.xcodeproj \
            -scheme daily_log \
            -destination 'platform=macOS' \
            -quiet

  release:
    name: release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
    env:
      # Developer ID signing + notarization, elva-labs' standard secret names
      # (see claude-stats / sesh-bar). release.sh signs ad-hoc when either half
      # is absent, and the "Signing not configured" step then warns.
      #   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD  password for that .p12
      #   MACOS_SIGN_IDENTITY         "Developer ID Application: Elva Group AB (WL4K563SDJ)"
      #   NOTARY_KEY                  base64 of the App Store Connect API .p8
      #   NOTARY_KEY_ID / NOTARY_ISSUER_ID   its key id and issuer id
      HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAVE_NOTARY: ${{ secrets.NOTARY_KEY != '' }}
      # Fine-grained PAT with Contents:write on elva-labs/homebrew-elva alone —
      # github.token cannot reach another repo. Without it the release still
      # ships and the "Tap not configured" step warns.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      # fetch-depth: 0 so `gh release create --generate-notes` can see history,
      # and so release.sh can pin the tag to this exact commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Every target carries the same MARKETING_VERSION. If they ever drift,
          # the version to release is genuinely ambiguous — stop rather than
          # guess which one is the app's. (macOS runners ship bash 3.2, so no
          # mapfile here.)
          versions=$(
            sed -n 's/[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' \
              daily_log.xcodeproj/project.pbxproj | sort -u
          )
          if [[ -z "$versions" ]]; then
            echo "::error::no MARKETING_VERSION found in project.pbxproj"
            exit 1
          fi
          if [[ $(printf '%s\n' "$versions" | wc -l) -ne 1 ]]; then
            echo "::error::MARKETING_VERSION differs across targets: $(echo $versions)"
            exit 1
          fi

          version="$versions"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::notice::v$version is already released — no new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$version is unreleased — cutting a release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        id: signing
        if: steps.version.outputs.publish == 'true' && env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          set -euo pipefail

          # A throwaway keychain that lives only for this job — never touch the
          # runner's login keychain. Keep `set -x` off regardless.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/cert.p12"
          KEY="$RUNNER_TEMP/notary.p8"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          # NOTARY_KEY is stored base64-encoded; accept a raw PEM too.
          if printf '%s' "$NOTARY_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$NOTARY_KEY" > "$KEY"
          else
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$KEY"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$CERT"

          echo "notary_key_path=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # The `test` job already ran the suite against this exact commit.
          SKIP_TESTS: 1
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key_path }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: Tools/release.sh --publish

      - name: Signing not configured
        if: steps.version.outputs.publish == 'true' && (env.HAVE_CERT != 'true' || env.HAVE_NOTARY != 'true')
        run: |
          echo "::warning::MACOS_CERTIFICATE / NOTARY_KEY are not both set — the release shipped ad-hoc signed, so users need 'brew install --cask --no-quarantine'. Set MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER_ID for notarized builds."

      - name: Update Homebrew tap
        id: tap
        if: steps.version.outputs.publish == 'true' && env.TAP_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # No `set -x` anywhere below: the token lives in the remote URL.
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/elva-labs/homebrew-elva.git" \
            tap

          cp build/release/daily-log.rb tap/Casks/daily-log.rb
          cd tap
          git add Casks/daily-log.rb

          # Re-running a release with an identical cask should be a no-op rather
          # than an empty commit.
          if git diff --cached --quiet; then
            echo "::notice::Tap already carries this cask — nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -c user.name="elva-bot" -c user.email="gh-bot@elva-group.com" \
            commit -qm "Update daily-log to $VERSION"
          git push -q
          echo "::notice::Pushed daily-log $VERSION to elva-labs/homebrew-elva."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Tap not configured
        if: steps.version.outputs.publish == 'true' && env.TAP_TOKEN == ''
        run: |
          echo "::warning::TAP_TOKEN is not set — the release shipped, but elva-labs/homebrew-elva still points at the previous version. Copy daily-log.rb from the release assets into Casks/, or set the secret."

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ steps.version.outputs.publish }}
          SIGNED: ${{ steps.version.outputs.publish == 'true' && env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true' }}
          TAP_PUSHED: ${{ steps.tap.outputs.pushed }}
        run: |
          if [[ "$PUBLISHED" == "true" ]]; then
            {
              echo "### Released \`v$VERSION\` :rocket:"
              echo
              if [[ "$SIGNED" == "true" ]]; then
                echo "Developer ID signed + notarized."
              else
                echo ":warning: Ad-hoc signed — set the signing secrets for a notarized build."
              fi
              echo
              if [[ "$TAP_PUSHED" == "true" ]]; then
                echo "\`elva-labs/homebrew-elva\` updated — \`brew upgrade --cask daily-log\` now serves \`$VERSION\`."
              elif [[ "$TAP_PUSHED" == "false" ]]; then
                echo "Tap already carried this cask; nothing to push."
              else
                echo ":warning: Tap **not** updated. Copy \`daily-log.rb\` from the release"
                echo "assets into \`elva-labs/homebrew-elva\`, or set \`TAP_TOKEN\`."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### No release"
              echo
              echo "\`MARKETING_VERSION\` is still \`$VERSION\`, which is already"
              echo "published. Bump it in Xcode to ship."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
